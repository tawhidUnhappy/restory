[project]
name = "restory"
version = "0.3.0"
description = "Standalone Manga & Webtoon Recap Video Production Toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "restory contributors" }
]
keywords = ["manga", "manhwa", "webtoon", "recap", "video", "tts", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["restory"]

[project.scripts]
restory = "restory.cli:main"