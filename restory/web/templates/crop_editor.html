<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paged Crop & Layer Editor — restory</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/crop_editor.css">
</head>
<body>
    <header>
        <div class="header-title">
            <span>restory Crop Editor</span>
            <div class="telemetry-badge" id="telemetry-banner">
                <span class="status-dot"></span>
                <span id="telemetry-gpu">GPU: Loading...</span>
            </div>
        </div>

        <div class="controls-group">
            <label for="chapter-select">Chapter:</label>
            <select id="chapter-select" onchange="switchChapter(this.value)"></select>

            <button onclick="prevPage()">&larr; Prev (A)</button>
            <span id="page-indicator" style="font-weight:600; min-width:80px; text-align:center;">Page 1 / 1</span>
            <button onclick="nextPage()">Next (D) &rarr;</button>
        </div>

        <div class="controls-group">
            <label for="engine-select">Detector:</label>
            <select id="engine-select">
                <option value="heuristic">CV Heuristic (Fast)</option>
                <option value="magi">MAGI v3 (AI)</option>
                <option value="hybrid">Hybrid (AI + Snap)</option>
            </select>
            <button onclick="runRedetect()">Re-Detect Page</button>
            <button class="btn-accent" onclick="saveAndRecrop()">Save & Re-Crop (Ctrl+S)</button>
            <button class="btn-success" onclick="finishAndContinue()">Done & Continue Pipeline &rarr;</button>
        </div>
    </header>

    <div class="main-container">
        <div class="canvas-area" id="canvas-wrapper">
            <canvas id="editor-canvas"></canvas>
        </div>

        <div class="sidebar">
            <div class="card">
                <div class="card-title">Reading Direction</div>
                <div style="display:flex; gap:15px;">
                    <label><input type="radio" name="rtl" value="true" checked onchange="updateRtl(true)"> RTL (Manga)</label>
                    <label><input type="radio" name="rtl" value="false" onchange="updateRtl(false)"> LTR (Webtoon)</label>
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    <span>Panel Layer Stack</span>
                    <button style="padding: 2px 6px; font-size:0.75rem;" onclick="addFullPageBox()">+ Full Page (F)</button>
                </div>
                <ul class="layer-list" id="layer-list"></ul>
            </div>

            <div class="card">
                <div class="card-title">Shortcuts</div>
                <div class="hotkey-list">
                    <p><kbd>A</kbd> / <kbd>&larr;</kbd> : Previous Page</p>
                    <p><kbd>D</kbd> / <kbd>&rarr;</kbd> : Next Page</p>
                    <p><kbd>F</kbd> : Full-Page Layer (0,0,W,H)</p>
                    <p><kbd>Del</kbd> / <kbd>Backspace</kbd> : Delete Selected Layer</p>
                    <p><kbd>Ctrl+S</kbd> : Save & Re-Crop</p>
                </div>
            </div>
        </div>
    </div>

    <div id="toast">Saved & Re-Cropped!</div>

    <script src="/static/js/telemetry.js"></script>
    <script src="/static/js/layer_manager.js"></script>
    <script src="/static/js/crop_editor.js"></script>
</body>
</html>
